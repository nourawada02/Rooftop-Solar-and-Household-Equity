# Starts PostgreSQL and MongoDB for the project.
# Usage: copy .env.example to .env, then run: docker compose up -d
services:
  postgres:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql runs automatically the first time the container starts
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data/clean:/data/clean:ro

  mongo:
    image: mongo:7
    env_file: .env
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - ./data/clean:/data/clean:ro

volumes:
  pgdata:
  mongodata:
